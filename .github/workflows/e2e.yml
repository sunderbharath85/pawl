name: E2E

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: e2e-${{ github.ref }}
  cancel-in-progress: true

jobs:
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      # Keep each suite's temp dir (hub data and logs) so a failure can be inspected from the artifact.
      E2E_KEEP: "1"
    steps:
      - uses: actions/checkout@v7
      # Voice models reach users only through the app's download, never through the repo.
      - name: No voice models in the repo
        run: bash scripts/check-no-models.sh
      - uses: oven-sh/setup-bun@v2
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      # (the runner context is not available in job-level env, so set TMPDIR here)
      - run: mkdir -p "$RUNNER_TEMP/e2e" && echo "TMPDIR=$RUNNER_TEMP/e2e" >> "$GITHUB_ENV"
      - run: bun install --frozen-lockfile
      - run: cargo build -p pawl-hub
      - name: Install Chromium
        working-directory: e2e
        run: bunx playwright install --with-deps chromium
      - name: End-to-end tests
        working-directory: e2e
        run: bun test --timeout 120000 ./tests
      - name: Keep hub data and logs
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: e2e-temp
          path: ${{ runner.temp }}/e2e
          retention-days: 7
