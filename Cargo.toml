[workspace]
resolver = "2"
members = ["crates/*"]
exclude = ["apps/desktop/src-tauri"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"

# Shared versions. Crates use `dep = { workspace = true }`.
# Crate-specific deps go in that crate's own Cargo.toml (do not edit this file).
[workspace.dependencies]
pet-protocol = { path = "crates/protocol" }
pet-acp = { path = "crates/acp" }
pet-discovery = { path = "crates/discovery" }
pet-brain = { path = "crates/brain" }
pet-relay-link = { path = "crates/relay-link" }
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
thiserror = "2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
uuid = { version = "1", features = ["v4", "serde"] }
futures = "0.3"
dirs = "6"
