[package]
name = "pawl-hub"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Pawl hub daemon: ACP host, session store, rules, WebSocket + hook endpoints, CLI"

[lib]
name = "pawl_hub"
path = "src/lib.rs"

[[bin]]
name = "pawl"
path = "src/main.rs"

[dependencies]
pawl-protocol = { workspace = true }
pawl-acp = { workspace = true }
pawl-discovery = { workspace = true }
pawl-brain = { workspace = true }
pawl-peer = { workspace = true }
# The root Cargo.toml is the orchestrator's; the A2A crate is referenced by path.
pawl-a2a = { path = "../a2a" }
tokio = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
anyhow = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
uuid = { workspace = true }
futures = { workspace = true }
axum = { version = "0.8.9", features = ["ws"] }
rusqlite = { version = "0.43.0", features = ["bundled"] }
clap = { version = "4.6.9", features = ["derive", "env"] }
toml = "1.2.2"
toml_edit = "0.25.20"
chrono = "0.4.45"
subtle = "2.6.1"
getrandom = "0.4.3"
hex = "0.4.3"
tokio-tungstenite = "0.29.0"
tracing-appender = "0.2.5"

[dev-dependencies]
tempfile = "3"
# Drives the A2A server's router without a socket in tests (already in the tree through axum).
tower = { version = "0.5", features = ["util"] }
