[package]
name = "pet-hub"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "AI Pet Hub daemon: ACP host, session store, rules, WebSocket + hook endpoints, CLI"

[lib]
name = "pet_hub"
path = "src/lib.rs"

[[bin]]
name = "pet-hub"
path = "src/main.rs"

[dependencies]
pet-protocol = { workspace = true }
pet-acp = { workspace = true }
pet-discovery = { workspace = true }
pet-brain = { workspace = true }
tokio = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
anyhow = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
uuid = { workspace = true }
futures = { workspace = true }
axum = { version = "0.8.9", features = ["ws"] }
rusqlite = { version = "0.43.0", features = ["bundled"] }
clap = { version = "4.6.9", features = ["derive", "env"] }
toml = "1.2.2"
chrono = "0.4.45"
subtle = "2.6.1"
getrandom = "0.4.3"
hex = "0.4.3"
tokio-tungstenite = "0.29.0"
tracing-appender = "0.2.5"

[dev-dependencies]
tempfile = "3"
