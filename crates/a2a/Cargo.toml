[package]
name = "pawl-a2a"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Pawl's A2A (Agent2Agent) layer: an A2A view of ACP sessions, structured-input approvals, 0.3/1.0 compatibility"

[dependencies]
pawl-protocol = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
anyhow = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }
tokio = { workspace = true }
futures = { workspace = true }
uuid = { workspace = true }
# Official A2A Rust SDK (https://github.com/a2aproject/a2a-rs), pre-1.0: pinned exactly and wrapped
# behind this crate's own functions. `a2a-lf` is imported as `a2a`.
a2a = { package = "a2a-lf", version = "=0.4.2" }
# The localhost A2A server (phase A2): the SDK's JSON-RPC / REST routers on the hub's axum, no TLS
# or push features (the server binds 127.0.0.1 and sends no push notifications).
a2a-server = { package = "a2a-server-lf", version = "=0.5.3", default-features = false }
chrono = { version = "0.4", default-features = false, features = ["std", "clock"] }
axum = "0.8.9"
tower = { version = "0.5", features = ["util"] }
subtle = "2.6.1"
# The SDK's RequestHandler is an #[async_trait] trait (re-exported for the hub).
async-trait = "0.1"
