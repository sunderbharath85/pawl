[package]
name = "pawl-desktop"
version = "0.1.1"
description = "Pawl desktop dog (Tauri 2)"
edition = "2021"
license = "MIT"
publish = false

# Excluded from the root Cargo workspace (see /Cargo.toml `exclude`).
[workspace]

[lib]
name = "pawl_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.7", features = [] }

[dependencies]
tauri = { version = "2.12", features = ["tray-icon", "image-png", "macos-private-api"] }
tauri-plugin-notification = "2.8"
tauri-plugin-dialog = "2.8"
tauri-plugin-single-instance = "2.5"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# Same major as the hub (workspace `dirs = "6"`) so both resolve the identical data dir.
dirs = "6"
# Voice (v0.2: wake word + speech to text, src/voice). sherpa-onnx links its prebuilt static libraries; the archive is
# fetched and checked against a pinned SHA-256 by scripts/fetch-sherpa.sh (see .cargo/config.toml).
sherpa-onnx = "~2.0.3"
# The pet's name -> keyword-spotter tokens (sentencepiece BPE), at runtime.
kitoken = { version = "0.11", default-features = false, features = ["std", "normalization", "convert-sentencepiece"] }
# Microphone capture. Linux uses ALSA (libasound2-dev at build time); PipeWire and PulseAudio serve ALSA clients.
cpal = "0.18"
# Model downloads (HTTPS from GitHub releases), verified before anything is unpacked.
reqwest = { version = "0.13", default-features = false, features = ["rustls", "system-proxy"] }
sha2 = "0.10"
tar = { version = "0.4", default-features = false }
# Pure-Rust bzip2 (libbz2-rs-sys, the crate's default backend): no system libbz2.
bzip2 = "0.6"
tauri-plugin-global-shortcut = "2"
# Screen capture (v0.2 "Show my screen", src/screen): screens and windows, in memory only. `wgc` = Windows Graphics
# Capture: GPU-drawn windows (WinUI, DirectComposition) come out right, where GDI's PrintWindow returns them black.
# Linux builds need pkg-config libclang-dev libxcb1-dev libxrandr-dev libdbus-1-dev libpipewire-0.3-dev
# libwayland-dev libegl-dev.
xcap = { version = "0.9.10", features = ["wgc"] }
# Scaling and encoding captures (JPEG / PNG only).
image = { version = "0.25", default-features = false, features = ["png", "jpeg"] }

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
# Unwind (not abort): a panic in a library on a worker thread (xcap's graphics setup, say) becomes an error for that
# feature instead of ending the app (src/panics.rs). Callbacks that C code calls stay panic-free.
panic = "unwind"
strip = true
